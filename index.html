<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eibiswald 380</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e40af">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Eibiswald 380">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style type="text/tailwindcss">
@layer components{
.card{@apply bg-white rounded-2xl shadow-md border border-sky-100 p-5 mb-4}
.btn{@apply inline-flex items-center justify-center gap-2 rounded-xl bg-blue-700 text-white font-semibold px-5 py-3 text-lg active:bg-blue-900}
.btn2{@apply bg-white text-blue-800 border-2 border-blue-700}
.btn-ok{@apply bg-green-700} .btn-bad{@apply bg-red-700}
.inp{@apply w-full rounded-xl border-2 border-slate-300 px-4 py-3 text-lg mb-3 bg-white}
.chip{@apply inline-block rounded-full px-3 py-1 text-base font-semibold mr-1 mb-1}
}</style>
<style>
.inp{display:block;width:100%;max-width:100%;min-width:0;box-sizing:border-box}
input[type=date].inp,input[type=time].inp{-webkit-appearance:none;appearance:none;min-height:3.6rem;text-align:left;overflow:hidden}
input[type=date].inp::-webkit-date-and-time-value,input[type=time].inp::-webkit-date-and-time-value{text-align:left;min-width:0}
input[type=file].inp{font-size:1rem}
</style></head>
<body class="bg-sky-50 text-slate-900 text-lg"><div id="app"></div>
<script>
const SB_URL='DEINE_SUPABASE_URL', SB_KEY='DEIN_ANON_KEY';
const sb=supabase.createClient(SB_URL,SB_KEY);
let me,cfg,view='home',admY,seenAt=new Date().toISOString();
const $=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>new Date(d).toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'Europe/Vienna'});
const p2=n=>String(n).padStart(2,'0');
const today=()=>new Date().toISOString().slice(0,10);
const v=id=>document.getElementById(id).value;
const isAdmin=()=>me?.role==='haussprecher';
const eur=n=>Number(n).toLocaleString('de-AT',{style:'currency',currency:'EUR'});
const isoW=d=>{d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));return Math.ceil(((d-Date.UTC(d.getUTCFullYear(),0,1))/864e5+1)/7)};
const isoY=d=>{d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));return d.getUTCFullYear()};
const wStart=(y,w)=>{const d=new Date(Date.UTC(y,0,4));d.setUTCDate(d.getUTCDate()-(d.getUTCDay()||7)+1+(w-1)*7);return d};
const wr=(y,w)=>{const a=wStart(y,w),b=new Date(a);b.setUTCDate(b.getUTCDate()+6);return fmt(a)+' – '+fmt(b)};
const weeksIn=y=>isoW(new Date(y,11,28));
const TZ={timeZone:'Europe/Vienna'};
const ft=x=>new Date(x).toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit',hourCycle:'h23',...TZ});
const fdt=x=>fmt(x)+', '+ft(x)+' Uhr';
const dIn=x=>new Date(x).toLocaleDateString('sv-SE',TZ);
function greet(){const d=new Date(),m=d.getMonth()+1,t=d.getDate(),h=d.getHours();
  if(m===12&&t>=24&&t<=26)return['gift','Frohe Weihnachten'];if(m===1&&t===1)return['party-popper','Frohes neues Jahr'];
  return h>=3&&h<9?['sunrise','Guten Morgen']:h>=9&&h<17?['sun','Schönen Tag']:h>=17&&h<21?['sunset','Schönen Abend']:['moon','Gute Nacht']}
const MODS={board:['Brett','clipboard-list','Schwarzes Brett'],events:['Termine','calendar-days','Veranstaltungen'],votes:['Abstimmung','vote','Abstimmungen'],mow:['Mähen','mower','Mähen'],winter:['Winter','snowflake','Winterdienst'],clean:['Reinigung','spray-can','Reinigungsplan']};
const MOW='<path d="M2 21h20"/><path d="M4 4l5 8"/><path d="M9 12h10v3H9z"/><circle cx="11" cy="18.5" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="M2 17v4M5 18v3"/>';
const I=(n,c='w-5 h-5')=>n==='mower'?`<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${MOW}</svg>`:`<i data-lucide="${n}" class="${c}"></i>`;
const card=(ic,t,b)=>`<div class="card"><h2 class="flex items-center gap-2 text-2xl font-bold text-blue-900 mb-3">${I(ic,'w-7 h-7 shrink-0')}<span>${t}</span></h2>${b}</div>`;
const run=async f=>{try{await f();await draw()}catch(x){alert(x.message||x)}};
async function up(f){if(!f)return null;const p=`${me.apartment}/${Date.now()}-${f.name.replace(/[^\w.-]/g,'_')}`;const{error}=await sb.storage.from('files').upload(p,f);if(error)throw error;return sb.storage.from('files').getPublicUrl(p).data.publicUrl}
const fileLink=u=>u?`<a class="text-blue-700 underline flex gap-1 items-center my-2" href="${e(u)}" target="_blank"><i data-lucide="paperclip" class="w-5 h-5"></i>Datei öffnen</a>`:'';

/* ---------- Start / Login ---------- */
async function init(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session)return loginView();
  const{data:p}=await sb.from('profiles').select().eq('id',session.user.id).single();
  me=p;await sb.rpc('cleanup_expired');await loadCfg();await loadSeen();
  sb.channel('s').on('postgres_changes',{event:'*',schema:'public',table:'settings'},async()=>{await loadCfg();draw()}).subscribe();
  draw();
}
async function loadSeen(){const{data}=await sb.from('board_seen').select().eq('apartment',me.apartment).maybeSingle();
  if(data)seenAt=data.seen_at;else{seenAt=new Date().toISOString();await sb.from('board_seen').upsert({apartment:me.apartment,seen_at:seenAt})}}
async function markSeen(){seenAt=new Date().toISOString();await sb.from('board_seen').upsert({apartment:me.apartment,seen_at:seenAt})}
async function loadCfg(){cfg=(await sb.from('settings').select().eq('id',1).single()).data}
function loginView(){
  $('#app').innerHTML=`<div class="max-w-md mx-auto p-6 pt-16"><div class="text-center mb-8"><img src="icon-192.png" alt="" class="w-24 h-24 mx-auto rounded-3xl shadow-lg"><h1 class="text-4xl font-extrabold text-blue-900 mt-2">Eibiswald 380</h1><p>Hausverwaltung</p></div>
  <div class="card"><label class="font-semibold">Wohnung</label><select id="l_a" class="inp">${[1,2,3,4,5,6,7,8,9].map(i=>`<option value="${i}">Wohnung ${i}</option>`).join('')}</select>
  <label class="font-semibold">Passwort</label><input id="l_p" type="password" class="inp" autocomplete="current-password">
  <button class="btn w-full" onclick="login()">Anmelden</button></div></div>`;lucide.createIcons();
}
async function login(){
  const{error}=await sb.auth.signInWithPassword({email:`whg${v('l_a')}@eibiswald380.app`,password:v('l_p')});
  if(error)return alert('Anmeldung fehlgeschlagen. Bitte Wohnung und Passwort prüfen.');
  init();
}
async function logout(){await sb.auth.signOut();location.reload()}

/* ---------- Layout ---------- */
const views={};
const go=x=>{view=x;draw(false)};
let drawTk=0;
async function draw(keep=true){
  const tk=++drawTk,y=window.scrollY;
  const tabs=[['home','Start','house'],...Object.entries(MODS).filter(([k])=>cfg.modules[k]).map(([k,m])=>[k,m[0],m[1]]),...(isAdmin()?[['admin','Admin','settings']]:[])];
  if(!tabs.some(t=>t[0]===view))view='home';
  let html;try{html=await views[view]()}catch(x){html=card('triangle-alert','Fehler',`<p>${e(x.message||x)}</p>`)}
  let unread=0;
  if(cfg.modules.board){if(view==='board')await markSeen();else{const{count}=await sb.from('posts').select('id',{count:'exact',head:true}).gt('created_at',seenAt).neq('author',me.id);unread=count||0}}
  if(tk!==drawTk)return;
  $('#app').innerHTML=`<header class="bg-blue-800 text-white px-4 py-3 flex justify-between items-center sticky top-0 z-10"><div><b class="text-xl">Eibiswald 380</b><div class="text-base">Wohnung ${me.apartment}${isAdmin()?' · Haussprecher':''}</div></div><button onclick="logout()" class="flex items-center gap-1 text-base underline"><i data-lucide="log-out" class="w-5 h-5"></i>Abmelden</button></header>
  <main id="main" class="max-w-3xl mx-auto p-4 pb-44 sm:pb-28">${html}</main>
  <nav style="padding-bottom:env(safe-area-inset-bottom)" class="fixed bottom-0 inset-x-0 bg-white border-t-2 border-sky-200 grid grid-cols-4 sm:flex sm:justify-around z-10">${tabs.map(t=>`<button onclick="go('${t[0]}')" class="sm:flex-1 py-2 flex flex-col items-center text-sm font-semibold ${view===t[0]?'text-blue-800 bg-sky-100':'text-slate-600'}"><span class="relative">${I(t[2],'w-7 h-7')}${t[0]==='board'&&unread?`<span class="absolute -top-1 -right-3 min-w-[1.4rem] h-[1.4rem] px-1 rounded-full bg-red-600 text-white text-sm font-bold flex items-center justify-center border-2 border-white">${unread>9?'9+':unread}</span>`:''}</span>${t[1]}</button>`).join('')}</nav>`;
  lucide.createIcons();window.scrollTo(0,keep?y:0);
}

/* ---------- Reinigung (Hilfsfunktionen) ---------- */
async function cleanData(y){
  y=y||isoY(new Date());const[p,d]=await Promise.all([sb.from('cleaning_plans').select().eq('year',y).maybeSingle(),sb.from('cleaning_done').select().eq('year',y)]);
  return{y,p:p.data,done:d.data||[]};
}
const grp=(p,w)=>p['w'+((w-1)%3+1)];
function cleanStatus(c,w,a){
  if(c.done.some(x=>x.week===w&&x.apartment===a))return'done';
  const ws=wStart(c.y,w).getTime(),n=Date.now();return n>=ws+7*864e5?'over':n>=ws?'now':'future';
}
const CS={done:['bg-green-100 text-green-900','check','erledigt'],over:['bg-red-200 text-red-900','triangle-alert','überfällig'],now:['bg-amber-200 text-amber-900','clock','diese Woche'],future:['bg-slate-100 text-slate-700','circle','offen']};
const cs=k=>`${I(CS[k][1],'w-4 h-4 inline -mt-1')} ${CS[k][2]}`;

/* ---------- Dashboard ---------- */
views.home=async()=>{
  const g=greet(),t=today(),items=[];let ann='',cl='',py='',evh='',vh='',bh='';
  const hd=`<h1 class="flex items-center gap-3 text-3xl font-extrabold text-blue-900 mb-4">${I(g[0],'w-9 h-9 shrink-0')}<span>${g[1]}, Wohnung ${me.apartment}!</span></h1>`;
  const{data:an}=await sb.from('announcements').select().gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false});
  (an||[]).forEach(x=>ann+=`<div class="rounded-2xl border-4 border-amber-500 bg-amber-50 p-5 mb-4"><h2 class="flex items-center gap-2 text-2xl font-extrabold text-amber-900">${I('megaphone','w-8 h-8 shrink-0')}<span>${e(x.title)}</span></h2><p class="whitespace-pre-line mt-2">${e(x.body)}</p><p class="text-base text-slate-600 mt-2">Wichtige Mitteilung des Haussprechers · ${fmt(x.created_at)}</p></div>`);
  if(cfg.modules.board){
    const{data:np}=await sb.from('posts').select().gt('created_at',seenAt).neq('author',me.id).order('created_at',{ascending:false}).limit(5);
    if(np?.length)bh=card('clipboard-list','Neu am Schwarzen Brett',np.map(x=>`<div class="py-3 border-b"><p class="font-bold">${e(x.title)}</p>${x.body?`<p class="whitespace-pre-line">${e(x.body.length>160?x.body.slice(0,160)+'…':x.body)}</p>`:''}${fileLink(x.file_url)}<p class="text-base text-slate-600">Wohnung ${x.author_apt} · ${fmt(x.created_at)}</p></div>`).join('')+`<button class="btn mt-3" onclick="go('board')">${I('clipboard-list')} Zum Schwarzen Brett</button>`);
  }
  if(cfg.modules.votes){
    const[{data:vs},{data:op},{data:an2}]=await Promise.all([sb.from('votes').select().order('ends_at'),sb.from('vote_options').select().order('position'),sb.from('vote_answers').select().eq('apartment',me.apartment)]);
    const now=Date.now(),act=(vs||[]).filter(x=>new Date(x.ends_at)>now),O=id=>(op||[]).filter(o=>o.vote_id===id),mine=id=>(an2||[]).filter(a=>a.vote_id===id).map(a=>a.option_id);
    act.forEach(x=>items.push([x.ends_at,'vote',`Abstimmung endet: ${e(x.title)} (${ft(x.ends_at)} Uhr)`]));
    const todo=act.filter(x=>!mine(x.id).length);
    if(todo.length)vh+=card('vote','Bitte abstimmen',todo.map(x=>`<div class="py-3 border-b"><p class="font-bold">${e(x.title)}</p><p class="text-base text-slate-600">Endet ${fdt(x.ends_at)}</p>${voteControls(x,O(x.id),[])}</div>`).join(''));
    const rec=(vs||[]).filter(x=>new Date(x.ends_at)<=now&&now-new Date(x.ends_at)<7*864e5);
    if(rec.length){const R=await Promise.all(rec.map(x=>sb.rpc('vote_stats',{p_vote:x.id})));
      vh+=card('vote','Abstimmungsergebnisse',rec.map((x,i)=>{const cnt=Object.fromEntries((R[i].data||[]).map(r=>[r.option_id,r.cnt]));return`<div class="py-3 border-b"><p class="font-bold">${e(x.title)} <span class="chip bg-slate-200 text-slate-800">beendet</span></p><p>Ergebnis: <b>${outcome(x,O(x.id),cnt)}</b></p></div>`}).join(''))}
  }
  if(cfg.modules.clean){
    const cy=isoY(new Date());let rows='',found=false,any=false;
    for(const y of [cy,cy+1]){if(found)break;if(y>cy&&Date.now()<wStart(y,1).getTime()-30*864e5)break;
      const c=await cleanData(y);if(!c.p)continue;any=true;
      for(let w=1;w<=weeksIn(c.y)&&!found;w++){if(!grp(c.p,w).includes(me.apartment))continue;const s=cleanStatus(c,w,me.apartment);if(s==='done')continue;if(s==='future')found=true;
        items.push([wStart(c.y,w).toISOString().slice(0,10),'spray-can',`Reinigung KW ${w}${s==='over'?' (überfällig)':''}`]);
        rows+=`<div class="py-2 border-b"><div class="flex items-center justify-between gap-2 flex-wrap"><span class="chip ${CS[s][0]}">KW ${w}: ${cs(s)}</span>${s!=='future'?`<span class="flex items-center gap-3"><span class="text-xl font-bold">Erledigt?</span><button class="btn btn-ok" onclick="cDone(${c.y},${w},${me.apartment})">Ja</button></span>`:''}</div><div class="text-base text-slate-600">${wr(c.y,w)}</div></div>`}}
    cl=card('spray-can','Meine Reinigung',rows||(any?`<p class="flex items-center gap-2 text-green-800 font-semibold">${I('circle-check','w-6 h-6')} Alles erledigt</p>`:'<p>Kein Plan hinterlegt.</p>'));
  }
  for(const m of [MC.mow,MC.winter]){if(!cfg.modules[m.k])continue;const k=m.k;
    const{data:md}=await sb.from(k+'_dates').select(`*,${k}_seasons(closed)`).gte('date',t).order('date').limit(3);
    (md||[]).filter(x=>!x[k+'_seasons']?.closed).forEach(x=>items.push([x.date,m.ic,`${m.n}${m.big&&x.big?' (große Wiese)':''}`]));
    const{data:pay0}=await sb.from(k+'_payments').select(`*,${k}_seasons(*)`).eq('apartment',me.apartment).neq('status','confirmed');const pay=(pay0||[]).filter(x=>!x[k+'_seasons']?.closed);
    if(pay.length){pay.filter(x=>x.status==='open').forEach(x=>items.push([x[k+'_seasons'].due_date,'banknote',`${m.n}: ${eur(x[k+'_seasons'].price)} fällig`]));
      py+=card('banknote',`${m.n}: offene Zahlungen`,pay.map(x=>{const s=x[k+'_seasons'],late=s.due_date<t&&x.status==='open';
      return`<div class="py-3 border-b"><p class="text-2xl font-extrabold ${late?'text-red-700':'text-blue-900'}">${eur(s.price)} <span class="text-base font-normal">${e(s.name)} · fällig ${fmt(s.due_date)}</span></p>${late?`<p class="text-red-700 font-bold">${I('triangle-alert','w-5 h-5 inline')} Überfällig</p>`:''}${x.status==='open'?`<div class="flex gap-2 flex-wrap mt-2"><button class="btn" onclick="payRep('${k}',${x.id},${s.id},'cash')">In bar übergeben</button><button class="btn btn2" onclick="payRep('${k}',${x.id},${s.id},'deposit')">Hinterlegt</button></div>`:`<p class="mt-1">${ps(x.status)}${x.deposit_place?' Ort: '+e(x.deposit_place):''}</p>`}</div>`}).join(''))}
  }
  if(cfg.modules.events){
    const[{data:ev},{data:rs}]=await Promise.all([sb.from('events').select().gte('date',t).order('date').limit(5),sb.from('event_rsvps').select().eq('apartment',me.apartment)]);
    if(ev?.length)evh=card('calendar-days','Veranstaltungen',ev.map(x=>{const g=(rs||[]).find(q=>q.event_id===x.id)?.going;
      return`<div class="py-3 border-b"><p class="font-bold">${fmt(x.date)} ${e(x.time?.slice(0,5)||'')} · ${e(x.title)}${x.place?` <span class="inline-flex items-center gap-1 font-normal text-slate-700">${I('map-pin','w-4 h-4')} ${e(x.place)}</span>`:''}</p>${g===undefined?`<div class="flex gap-2 flex-wrap mt-2"><button class="btn btn-ok" onclick="rsvp(${x.id},true)">${I('check')} Wir sind dabei</button><button class="btn btn2" onclick="rsvp(${x.id},false)">${I('x')} Nicht dabei</button></div>`:`<p class="mt-1"><span class="chip ${g?'bg-green-100 text-green-900':'bg-slate-200 text-slate-800'}">${I(g?'check':'x','w-4 h-4 inline -mt-1')} ${g?'Zugesagt':'Abgesagt'}</span></p>`}</div>`}).join(''));
    (ev||[]).forEach(x=>items.push([x.date,'calendar-days',`${e(x.title)} ${e(x.time?.slice(0,5)||'')}${x.place?' · '+e(x.place):''}`]));
  }
  const list=items.sort((a,b)=>a[0]>b[0]?1:-1).map(i=>`<div class="flex items-center gap-3 py-2 border-b border-sky-100"><span class="text-blue-700">${I(i[1],'w-6 h-6')}</span><b>${fmt(i[0])}</b><span>${i[2]}</span></div>`).join('');
  return hd+ann+card('calendar','Demnächst',list||'<p>Nichts geplant.</p>')+bh+vh+cl+py+evh;
};

/* ---------- Schwarzes Brett ---------- */
views.board=async()=>{
  const{data}=await sb.from('posts').select().order('created_at',{ascending:false});
  return card('plus-circle','Neuer Beitrag',`<input id="p_t" class="inp" placeholder="Titel"><textarea id="p_b" class="inp" rows="3" placeholder="Text"></textarea><input id="p_f" type="file" class="inp"><button class="btn" onclick="addPost()">Veröffentlichen</button>`)+
  (data||[]).map(p=>card('pin',e(p.title)+(p.author!==me.id&&new Date(p.created_at)>new Date(seenAt)?' <span class="chip bg-red-600 text-white align-middle">Neu</span>':''),`<p class="whitespace-pre-line">${e(p.body)}</p>${fileLink(p.file_url)}<p class="text-base text-slate-600 mt-2">Wohnung ${p.author_apt} · ${fmt(p.created_at)}</p>${isAdmin()||p.author===me.id?`<div class="flex gap-2 mt-3"><button class="btn btn2" onclick="editPost(${p.id})">Bearbeiten</button><button class="btn btn-bad" onclick="delRow('posts',${p.id})">Löschen</button></div>`:''}`)).join('');
};
const addPost=()=>run(async()=>{const f=$('#p_f').files[0],u=await up(f);const{error}=await sb.from('posts').insert({title:v('p_t'),body:v('p_b'),file_url:u,author_apt:me.apartment});if(error)throw error});
const editPost=id=>run(async()=>{const t=prompt('Neuer Titel?');if(t===null)return;const b=prompt('Neuer Text?');await sb.from('posts').update({title:t,body:b}).eq('id',id)});
const delRow=(t,id)=>confirm('Wirklich löschen?')&&run(async()=>{const{error}=await sb.from(t).delete().eq('id',id);if(error)throw error});

/* ---------- Veranstaltungen ---------- */
views.events=async()=>{
  const[{data:ev},{data:rs}]=await Promise.all([sb.from('events').select().gte('date',today()).order('date'),sb.from('event_rsvps').select()]);
  return card('plus-circle','Neue Veranstaltung',`<input id="e_t" class="inp" placeholder="Titel"><input id="e_d" type="date" class="inp"><input id="e_h" type="time" class="inp"><input id="e_o" class="inp" placeholder="Ort"><input id="e_f" type="file" class="inp"><button class="btn" onclick="addEv()">Speichern</button>`)+
  (ev||[]).map(x=>{const r=(rs||[]).filter(q=>q.event_id===x.id),mine=r.find(q=>q.apartment===me.apartment),n=g=>r.filter(q=>q.going===g).map(q=>q.apartment).sort().join(', ')||'–';
  return card('calendar-days',e(x.title),`<p class="font-bold">${fmt(x.date)} ${e(x.time?.slice(0,5)||'')} · ${e(x.place||'')}</p>${fileLink(x.file_url)}

function weeksHtml(c,collapse){
  const W=weeksIn(c.y),n=Date.now();let old='',no=0,cur='';
  for(let w=1;w<=W;w++){
    const ws=wStart(c.y,w).getTime(),past=n>=ws+7*864e5,isNow=!past&&n>=ws,sts=grp(c.p,w).map(a=>[a,cleanStatus(c,w,a)]);
    const row=`<div class="py-3 border-b ${isNow?'bg-sky-100 rounded-xl px-2':''}"><b class="text-xl">KW ${w}${isNow?' (jetzt)':''}</b> <span class="text-base text-slate-600">${wr(c.y,w)}</span><div class="mt-1">${sts.map(([a,s])=>`<span class="chip ${CS[s][0]}">Whg ${a}: ${cs(s)}</span>${(a===me.apartment||isAdmin())&&s!=='done'&&s!=='future'?`<button class="btn btn-ok !py-1 !px-3 !text-base mr-2" onclick="cDone(${c.y},${w},${a})">Erledigt</button>`:''}${isAdmin()&&s==='done'?`<button class="text-sm underline mr-2" onclick="cUndo(${c.y},${w},${a})">zurück</button>`:''}`).join('')}</div></div>`;
    if(collapse&&past&&sts.every(x=>x[1]==='done')){old+=row;no++}else cur+=row;
  }
  return(no?`<details class="mb-2"><summary class="cursor-pointer font-semibold text-blue-800 py-2">Vergangene Kalenderwochen (${no})</summary>${old}</details>`:'')+cur;
}

    let b=`<p class="text-base text-slate-600">${a?'Endet':'Beendet'}: <b>${fdt(x.ends_at)}</b> · ${KIND[x.kind]} · eine Stimme je Wohnung</p>${x.description?`<p class="whitespace-pre-line mt-2">${e(x.description)}</p>`:''}${(x.files||[]).map(f=>`<a class="text-blue-700 underline flex gap-1 items-center my-2" href="${e(f.u)}" target="_blank">${I('paperclip')} ${e(f.n)}</a>`).join('')}`;
    if(a){b+=voteControls(x,O,mine);if(!mine.length)b+=`<p class="text-base text-slate-600 mt-2">Sie haben noch nicht abgestimmt.</p>`;
      if(isAdmin())b+=`<p class="font-semibold mt-3">${I('users','w-5 h-5 inline')} ${new Set((ans||[]).filter(q=>q.vote_id===x.id).map(q=>q.apartment)).size} von 9 Wohnungen haben abgestimmt</p>`}
    else b+=voteResult(x,O,R[i]?.data);
    if(isAdmin())b+=`<div class="flex gap-2 flex-wrap mt-4"><button class="btn btn2" onclick="editVote(${x.id})">${I('pencil')} Bearbeiten</button>${a?'':`<button class="btn btn2" onclick="votePdf(${x.id})">${I('file-down')} PDF exportieren</button>`}<button class="btn btn-bad" onclick="delVote(${x.id})">${I('trash-2')} Löschen</button></div>`;
    const L=(lg||[]).filter(l=>l.vote_id===x.id);
    b+=`<details class="mt-4"><summary class="font-semibold cursor-pointer text-blue-800">Änderungshistorie</summary>${L.map(l=>`<p class="text-base border-b py-1">${fdt(l.at)} · <b>${e(l.by_name)}</b>: ${e(l.text)}</p>`).join('')||'<p>Keine Einträge.</p>'}</details>`;
    return card('vote',e(x.title),b)}).join('')||card('vote','Keine Abstimmungen','<p>Aktuell gibt es keine Abstimmungen.</p>');
  if(isAdmin()){const gone=(lg||[]).filter(l=>!(vs||[]).some(x=>x.id===l.vote_id));if(gone.length)h+=`<details class="card"><summary class="font-semibold cursor-pointer text-blue-800">Gelöschte Abstimmungen (Historie)</summary>${gone.map(l=>`<p class="text-base border-b py-1">${fdt(l.at)} · <b>${e(l.by_name)}</b>: ${e(l.title)} – ${e(l.text)}</p>`).join('')}</details>`}
  return h;
};
const editVote=id=>{const x=vCache.vs.find(q=>q.id===id);vEdit={...x,options:vCache.op.filter(o=>o.vote_id===id),hasAnswers:vCache.ans.some(a=>a.vote_id===id)};draw(false)};
const saveVote=()=>run(async()=>{
  const ev=vEdit,title=v('v_t').trim(),desc=v('v_b').trim();if(!title)throw new Error('Bitte einen Titel eingeben.');
  const kind=ev?ev.kind:v('v_k'),labels=kind==='yesno'?['Ja','Nein']:v('v_o').split('\n').map(x=>x.trim()).filter(Boolean);
  if(kind!=='yesno'&&new Set(labels).size<2)throw new Error('Bitte mindestens zwei verschiedene Antworten eingeben (eine pro Zeile).');
  if(!v('v_d')||!v('v_h'))throw new Error('Bitte Datum und Uhrzeit des Endes angeben.');
  const ends=new Date(`${v('v_d')}T${v('v_h')}`);if(isNaN(ends))throw new Error('Ungültiges Datum.');if(!ev&&ends<=new Date())throw new Error('Das Ende muss in der Zukunft liegen.');
  const keep=(ev?.files||[]).filter((f,i)=>document.querySelector('.vfx[value="'+i+'"]')?.checked),nf=[...$('#v_f').files];
  if(keep.length+nf.length>20)throw new Error('Maximal 20 Dateianhänge je Abstimmung.');
  const files=[...keep];for(const f of nf)files.push({n:f.name,u:await up(f)});
  const row={title,description:desc,ends_at:ends.toISOString(),files};
  if(!ev){const{data:r,error}=await sb.from('votes').insert({...row,kind}).select().single();if(error)throw error;
    const{error:e2}=await sb.from('vote_options').insert(labels.map((l,i)=>({vote_id:r.id,label:l,position:i})));if(e2)throw e2;
    await vlog(r.id,r.title,`Abstimmung angelegt, Ende ${fdt(r.ends_at)}, ${files.length} Anhang/Anhänge`)}
  else{const ch=[],old=ev.options.map(o=>o.label);
    if(title!==ev.title)ch.push(`Titel geändert: „${ev.title}“ → „${title}“`);if(desc!==(ev.description||''))ch.push('Beschreibung geändert');
    if(row.ends_at!==new Date(ev.ends_at).toISOString())ch.push(`Ende geändert: ${fdt(ev.ends_at)} → ${fdt(row.ends_at)}`);
    if(files.length!==(ev.files||[]).length||nf.length)ch.push(`Anhänge geändert (${(ev.files||[]).length} → ${files.length})`);
    const optCh=!ev.hasAnswers&&kind!=='yesno'&&JSON.stringify(labels)!==JSON.stringify(old);if(optCh)ch.push('Antwortmöglichkeiten geändert');
    if(!ch.length){vEdit=null;return}
    const{error}=await sb.from('votes').update(row).eq('id',ev.id);if(error)throw error;
    if(optCh){await sb.from('vote_options').delete().eq('vote_id',ev.id);const{error:e3}=await sb.from('vote_options').insert(labels.map((l,i)=>({vote_id:ev.id,label:l,position:i})));if(e3)throw e3}
    await vlog(ev.id,title,ch.join('; '))}
  vEdit=null});
const delVote=id=>run(async()=>{const x=vCache.vs.find(q=>q.id===id);if(!confirm('Abstimmung „'+x.title+'“ mit allen Stimmen endgültig löschen?'))return;await vlog(id,x.title,'Abstimmung gelöscht');const{error}=await sb.from('votes').delete().eq('id',id);if(error)throw error;if(vEdit?.id===id)vEdit=null});
async function votePdf(id){
  const[{data:vt},{data:op},{data:an}]=await Promise.all([sb.from('votes').select().eq('id',id).single(),sb.from('vote_options').select().eq('vote_id',id).order('position'),sb.from('vote_answers').select().eq('vote_id',id)]);
  const cnt={};(an||[]).forEach(a=>cnt[a.option_id]=(cnt[a.option_id]||0)+1);const voters=new Set((an||[]).map(a=>a.apartment)).size,lab=Object.fromEntries(op.map(o=>[o.id,o.label]));
  const doc=new window.jspdf.jsPDF();doc.setFontSize(16);doc.text('Abstimmung - Eibiswald 380',14,16);doc.setFontSize(13);
  const tl=doc.splitTextToSize(vt.title,180);doc.text(tl,14,26);let y=26+7*tl.length;doc.setFontSize(10);
  [`Art: ${KIND[vt.kind]} (eine Stimme je Wohnung)`,`Ende: ${fdt(vt.ends_at)}`,`Beteiligung: ${voters} von 9 Wohnungen`,`Ergebnis: ${outcome(vt,op,cnt)}`].forEach(t=>{doc.text(t,14,y);y+=6});
  if(vt.description){const dl=doc.splitTextToSize(vt.description,180);doc.text(dl,14,y+2);y+=dl.length*5+4}
  doc.autoTable({head:[['Antwort','Stimmen','Anteil']],body:op.map(o=>[o.label,String(cnt[o.id]||0),(voters?Math.round((cnt[o.id]||0)/voters*100):0)+' %']),startY:y+4,styles:{fontSize:10},headStyles:{fillColor:[30,64,175]}});
  doc.autoTable({head:[['Wohnung','Abgegebene Antwort(en)']],body:[1,2,3,4,5,6,7,8,9].map(n=>{const mine=(an||[]).filter(a=>a.apartment===n).map(a=>lab[a.option_id]);return['Wohnung '+n,mine.length?mine.join(', '):'keine Stimme abgegeben']}),startY:doc.lastAutoTable.finalY+8,styles:{fontSize:10},headStyles:{fillColor:[30,64,175]}});
  doc.setFontSize(8);doc.text('Erstellt am '+fdt(new Date()),14,287);doc.save('Abstimmung-'+vt.title.replace(/[^\w-]+/g,'_').slice(0,40)+'.pdf');
}

/* ---------- Admin ---------- */
const mowAdmin=(m,se)=>{const k=m.k;return card('lock',`${m.ss} abschließen`,se.length?se.map(s=>`<div class="flex items-center justify-between gap-2 py-3 border-b flex-wrap"><b>${e(s.name)}</b>${s.closed?`<span class="chip bg-slate-200 text-slate-800">${I('lock','w-4 h-4 inline')} abgeschlossen</span><button class="btn btn2" onclick="reopenSeason('${k}',${s.id})">${I('lock-open')} Wieder öffnen</button>`:`<button class="btn btn2" onclick="closeSeason('${k}',${s.id})">${I('lock')} Abschließen</button>`}</div>`).join('')+'<p class="text-base mt-2">Abgeschlossene Saisons sind erst nach „Wieder öffnen“ veränderbar, beim Haussprecher eingeklappt und bei Bewohnern nur noch als Rückschau sichtbar.</p>':'<p>Keine Saisons vorhanden.</p>')
 +card(m.ic,`Neue ${m.s}`,`<input id="${k}_sn" class="inp" placeholder="${m.ph}"><input id="${k}_sp" type="number" step="0.01" class="inp" placeholder="Preis je Wohnung (€)"><label>Fällig am</label><input id="${k}_sd" type="date" class="inp"><label>Erinnerung (Tage vor Fälligkeit)</label><input id="${k}_sr" type="number" class="inp" value="14"><button class="btn" onclick="addSeason('${k}')">Saison anlegen</button>`)
 +card('calendar-plus',`${m.t} eintragen`,`<select id="${k}_ms" class="inp">${se.filter(s=>!s.closed).map(s=>`<option value="${s.id}">${e(s.name)}</option>`).join('')}</select><input id="${k}_md" type="date" class="inp">${m.big?`<label class="flex gap-3 items-center mb-3"><input id="${k}_mb" type="checkbox" class="w-7 h-7">Große Wiese</label>`:''}<button class="btn" onclick="addMow('${k}')">${m.t} speichern</button>`)};
views.admin=async()=>{
  const[{data:an},c,sM,sW]=await Promise.all([sb.from('announcements').select().order('created_at',{ascending:false}),cleanData(admY),cfg.modules.mow?sb.from('mow_seasons').select():{data:[]},cfg.modules.winter?sb.from('winter_seasons').select():{data:[]}]);const cy=isoY(new Date());
  return card('megaphone','Wichtige Mitteilung an alle',`<input id="n_t" class="inp" placeholder="Überschrift"><textarea id="n_b" class="inp" rows="3" placeholder="Mitteilung"></textarea><label class="font-semibold">Anzeigedauer (Tage)</label><input id="n_d" type="number" min="1" class="inp" value="7"><button class="btn" onclick="addAnn()">${I('send')} An alle senden</button>${(an||[]).map(x=>{const old=new Date(x.expires_at)<new Date();return`<div class="flex items-center justify-between gap-2 py-3 border-b"><div><b>${e(x.title)}</b><br><span class="text-base ${old?'text-slate-500':'text-green-800'}">${old?'abgelaufen':'sichtbar'} bis ${fmt(x.expires_at)}</span></div><button class="p-2 text-red-700" onclick="delRow('announcements',${x.id})">${I('trash-2','w-6 h-6')}</button></div>`}).join('')}`)
  +card('toggle-right','Module ein-/ausschalten',Object.entries(MODS).map(([k,m])=>`<label class="flex items-center justify-between py-3 border-b"><span>${m[2]}</span><input type="checkbox" class="w-8 h-8" ${cfg.modules[k]?'checked':''} onchange="setMod('${k}',this.checked)"></label>`).join(''))
  +card('timer','Schwarzes Brett: Aufbewahrung',`<label>Beiträge löschen nach (Tagen)</label><input id="a_ret" type="number" min="1" class="inp" value="${cfg.retention_days}"><button class="btn" onclick="setRet()">Speichern</button>`)
  +card('key-round','Passwörter der Bewohner',[1,2,3,4,5,6,7,8,9].map(i=>`<div class="flex gap-2 mb-2 items-center"><b class="w-24 shrink-0">Whg ${i}</b><input id="pw${i}" class="inp !mb-0" placeholder="Neues Passwort"><button class="btn !px-3" onclick="setPw(${i})"><i data-lucide="check"></i></button></div>`).join('')+'<p class="text-base mt-2">Mindestens 6 Zeichen.</p>')
  +(cfg.modules.mow?mowAdmin(MC.mow,sM.data||[]):'')+(cfg.modules.winter?mowAdmin(MC.winter,sW.data||[]):'')
  +card('spray-can','Reinigungsplan '+c.y,`<label class="font-semibold">Jahr</label><select class="inp" onchange="setY(this.value)">${[0,1,2,3].map(i=>`<option ${cy+i===c.y?'selected':''}>${cy+i}</option>`).join('')}</select><p class="mb-2">Wohnungen der ersten 3 Wochen (Komma-getrennt). Der Turnus wird für das ganze Jahr fortgeschrieben.</p>${[1,2,3].map(n=>`<label>KW ${n}</label><input id="c${n}" class="inp" value="${c.p?c.p['w'+n].join(', '):[[1,4,7],[2,5,8],[3,6,9]][n-1].join(', ')}">`).join('')}<div class="flex gap-2 flex-wrap"><button class="btn" onclick="savePlan(${c.y})">Plan speichern</button><button class="btn btn2" onclick="carry(${c.y})">Turnus aus ${c.y-1} fortschreiben</button><button class="btn btn2" onclick="pdfPlan(${c.y})">${I('file-down')} Als PDF exportieren</button></div>`);
};
const setMod=(k,on)=>run(async()=>{cfg.modules[k]=on;const{error}=await sb.from('settings').update({modules:cfg.modules}).eq('id',1);if(error)throw error});
const setRet=()=>run(async()=>{const{error}=await sb.from('settings').update({retention_days:+v('a_ret')}).eq('id',1);if(error)throw error;await loadCfg();alert('Gespeichert')});
const setPw=i=>run(async()=>{const{error}=await sb.rpc('admin_set_password',{p_apartment:i,p_password:v('pw'+i)});if(error)throw error;$('#pw'+i).value='';alert(`Passwort für Wohnung ${i} gesetzt.`)});
const savePlan=y=>run(async()=>{const a=n=>v('c'+n).split(',').map(x=>+x.trim()).filter(Boolean);const{error}=await sb.from('cleaning_plans').upsert({year:y,w1:a(1),w2:a(2),w3:a(3)});if(error)throw error;alert('Plan gespeichert.')});

const setY=y=>{admY=+y;draw()};
const carry=y=>run(async()=>{const{data:p}=await sb.from('cleaning_plans').select().eq('year',y-1).maybeSingle();if(!p)throw new Error('Für '+(y-1)+' gibt es keinen Plan.');const G=[p.w1,p.w2,p.w3],N=weeksIn(y-1);const{error}=await sb.from('cleaning_plans').upsert({year:y,w1:G[N%3],w2:G[(N+1)%3],w3:G[(N+2)%3]});if(error)throw error;alert('Turnus aus '+(y-1)+' fortgeschrieben.')});
async function pdfPlan(y){
  const c=await cleanData(y);if(!c.p)return alert('Für '+y+' gibt es noch keinen Plan.');
  const doc=new window.jspdf.jsPDF();doc.setFontSize(16);doc.text('Reinigungsplan '+y+' - Eibiswald 380',14,16);
  const rows=[];for(let w=1;w<=weeksIn(y);w++)rows.push(['KW '+w,wr(y,w),grp(c.p,w).join(', '),c.done.filter(x=>x.week===w).map(x=>x.apartment).sort().join(', ')||'-']);
  doc.autoTable({head:[['KW','Zeitraum','Wohnungen','Erledigt von']],body:rows,startY:22,styles:{fontSize:10},headStyles:{fillColor:[30,64,175]}});
  doc.save('Reinigungsplan-'+y+'.pdf');
}
init();
